name: CI/CD Konekt

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nachiroumansour/konekt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install

      - name: Build client
        run: cd client && npm run build

  docker:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: /srv/projects/konekt

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            cd /srv/projects/konekt
            test -f .env
            cp .env .env.runtime
            printf '\nIMAGE_TAG=%s\n' '${{ github.sha }}' >> .env.runtime
            env -u DATABASE_URL -u JWT_SECRET -u ADMIN_PHONE -u ADMIN_PASSWORD -u LETSENCRYPT_EMAIL -u IMAGE_TAG -u KONEKT_IMAGE \
              docker compose --env-file .env.runtime pull konekt
            env -u DATABASE_URL -u JWT_SECRET -u ADMIN_PHONE -u ADMIN_PASSWORD -u LETSENCRYPT_EMAIL -u IMAGE_TAG -u KONEKT_IMAGE \
              docker compose --env-file .env.runtime up -d --force-recreate --remove-orphans
            env -u DATABASE_URL -u JWT_SECRET -u ADMIN_PHONE -u ADMIN_PASSWORD -u LETSENCRYPT_EMAIL -u IMAGE_TAG -u KONEKT_IMAGE \
              docker compose --env-file .env.runtime ps
            rm -f .env.runtime
            docker image prune -f
