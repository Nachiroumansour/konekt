name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env <<EOF
          WA_SECRET=${{ secrets.WA_SECRET }}
          VIRTUAL_HOST=${{ secrets.VIRTUAL_HOST }}
          LETSENCRYPT_HOST=${{ secrets.VIRTUAL_HOST }}
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          # Les variables DB sont gérées par docker-compose.yml
          PORT=4001
          NODE_ENV=production
          EOF

      - name: Build Backend Docker image
        run: |
          docker build --no-cache -t konekt/konekt:latest -f server/Dockerfile .


      - name: Deploy with Docker Compose
        run: |
          docker compose --env-file .env build --no-cache konekt
          docker compose --env-file .env up -d konekt

      - name: Wait for services to be healthy
        run: |
          sleep 15
          echo "🔍 Vérifying services..."
          docker ps | grep konekt

      - name: Health check
        run: |
          curl -f https://${{ secrets.VIRTUAL_HOST }} || echo "⏳ Site not yet ready (SSL provisioning may take 2-5 min)"

      - name: Cleanup old images
        run: |
          docker image prune -f

      - name: Show container logs
        if: failure()
        run: |
          docker logs konekt --tail 50 2>/dev/null || true
