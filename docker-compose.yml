services:
  konekt:
    image: ghcr.io/nachiroumansour/konekt:latest
    container_name: konekt
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    environment:
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PHONE=${ADMIN_PHONE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VIRTUAL_HOST=konekt.livelink.store
      - LETSENCRYPT_HOST=konekt.livelink.store
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - wa-sessions:/app/.wwebjs_auth
    networks:
      - nginx-proxy

volumes:
  wa-sessions:

networks:
  nginx-proxy:
    external: true
