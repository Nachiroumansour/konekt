services:
  konekt:
    image: ghcr.io/nachiroumansour/konekt:${IMAGE_TAG:-latest}
    container_name: konekt
    restart: unless-stopped
    # Chromium (whatsapp-web.js) consomme ~500-800 Mo au boot par session.
    # 1 Go était trop juste -> Chromium se faisait tuer (OOM) et la session
    # restait bloquée en STARTING. On laisse de la marge.
    mem_limit: 2048m
    cpus: 1.5
    environment:
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PHONE=${ADMIN_PHONE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VIRTUAL_HOST=konekt.livelink.store
      - LETSENCRYPT_HOST=konekt.livelink.store
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - wa-sessions:/app/.wwebjs_auth
    networks:
      - nginx-proxy

volumes:
  wa-sessions:

networks:
  nginx-proxy:
    external: true
